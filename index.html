<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stargazer — Live 3D Solar System</title>
<meta name="description" content="An explorable, real-time 3D model of the solar system at true scale. Planet and moon positions are computed for your current time.">
<style>
  :root {
    --ui-bg: rgba(10, 14, 26, 0.78);
    --ui-border: rgba(120, 150, 255, 0.18);
    --ui-text: #c9d4f0;
    --accent: #6ea8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #03050b; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ui-text); }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; }

  .label {
    position: fixed;
    font-size: 11px;
    color: rgba(201, 212, 240, 0.85);
    text-shadow: 0 0 4px #000, 0 0 2px #000;
    transform: translate(8px, -6px);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    z-index: 2;
  }
  .label:hover { color: #fff; }
  .label.moon { font-size: 10px; opacity: 0.8; }

  .panel {
    position: fixed;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 10px 14px;
    user-select: none;
    z-index: 10;
  }
  #hud-top {
    top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 24px);
  }
  #clock { font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
  #clock .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #4ade80; margin-right: 6px; vertical-align: 1px;
    animation: pulse 2s ease-in-out infinite;
  }
  #clock.warped .live-dot { background: #fbbf24; animation: none; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  .btn {
    background: rgba(110, 168, 255, 0.12);
    border: 1px solid var(--ui-border);
    color: var(--ui-text);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(110, 168, 255, 0.25); }
  .btn.active { background: var(--accent); color: #04060d; border-color: var(--accent); }
  .btn-group { display: flex; gap: 4px; align-items: center; }
  .btn-group .lbl { font-size: 11px; opacity: 0.55; margin-right: 2px; }

  #info {
    bottom: 12px; left: 12px;
    max-width: 290px;
    font-size: 12.5px;
    line-height: 1.55;
    display: none;
  }
  #info h2 { font-size: 16px; margin-bottom: 4px; color: #fff; font-weight: 600; }
  #info .close { position: absolute; top: 6px; right: 10px; cursor: pointer; opacity: 0.6; font-size: 14px; }
  #info .close:hover { opacity: 1; }
  #info dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin-top: 6px; }
  #info dt { opacity: 0.55; }
  #info dd { font-variant-numeric: tabular-nums; }

  #launch {
    top: 124px; right: 12px;
    width: 284px;
    font-size: 12px;
    max-height: calc(100vh - 150px);
    overflow-y: auto;
  }
  #launch summary { cursor: pointer; font-weight: 600; user-select: none; }
  #launch .lbody { margin-top: 8px; }
  #launch .lrow {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin: 4px 0;
  }
  #launch .lrow label { opacity: 0.7; white-space: nowrap; }
  #launch input {
    background: rgba(110, 168, 255, 0.08);
    border: 1px solid var(--ui-border);
    color: var(--ui-text);
    border-radius: 6px;
    padding: 2px 6px;
    width: 132px;
    font-size: 11.5px;
  }
  #launch input[type="datetime-local"] {
    width: 168px;
    color-scheme: dark;   /* legible native picker */
  }
  #launch input[type="checkbox"] { width: auto; }
  #launch .lbtns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  #l-status { margin-top: 8px; font-size: 11px; line-height: 1.5; opacity: 0.85; }
  #sidebar {
    left: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 2px;
    padding: 8px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }
  #sidebar .nav {
    display: flex; align-items: center; gap: 8px;
    background: transparent; border: none;
    color: var(--ui-text);
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 7px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
  }
  #sidebar .nav:hover { background: rgba(110, 168, 255, 0.18); }
  #sidebar .nav.active { background: rgba(110, 168, 255, 0.3); color: #fff; }
  #sidebar .nav .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
  }
  #sidebar hr {
    border: none; border-top: 1px solid var(--ui-border); margin: 5px 4px;
  }
  #hint {
    bottom: 12px; right: 12px;
    font-size: 11.5px;
    opacity: 0.75;
    text-align: right;
    line-height: 1.6;
    pointer-events: none;
  }
  #readout {
    top: 64px; right: 12px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    line-height: 1.5;
  }
  @media (max-width: 640px) {
    #hint { display: none; }
    #sidebar {
      top: auto; bottom: 12px; left: 12px; right: 12px; transform: none;
      flex-direction: row; overflow-x: auto; max-height: none;
    }
    #readout { top: auto; bottom: 70px; }
    #info { max-width: calc(100vw - 24px); bottom: 70px; }
    #launch { top: 110px; width: 262px; max-height: 50vh; }
  }
</style>

      <button class="btn" id="l-launch">Launch</button>
      <button class="btn" id="l-clear">Clear</button>
    </div>
    <div id="l-status"></div>
  </div>
</details>

<div id="readout" class="panel">
  <div id="readout-focus"></div>
  <div id="readout-dist"></div>
</div>

<div id="info" class="panel">

  <dl id="info-stats"></dl>
</div>

<div id="hint" class="panel">
  drag to orbit · scroll / pinch to zoom · right-drag to pan<br>

/* --- orbital mechanics (ecliptic frame, AU) --- */
function julianCenturies(ms) { return (ms / 86400000 + 2440587.5 - 2451545.0) / 36525; }
function daysSinceJ2000(ms)  { return ms / 86400000 + 2440587.5 - 2451545.0; }
function solveKepler(M, e) {
  let E = e > 0.8 ? Math.PI * Math.sign(M || 1) : M + e * Math.sin(M);
  for (let i = 0; i < 30; i++) {
    const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-9) break;
  }
  return E;
}
function elementsAt(p, T) {
  return {
    a:  p.el[0] + p.rate[0] * T,
    e:  p.el[1] + p.rate[1] * T,
    I:  (p.el[2] + p.rate[2] * T) * DEG,
    ln: (p.el[5] + p.rate[5] * T) * DEG,
    w:  (p.el[4] + p.rate[4] * T - (p.el[5] + p.rate[5] * T)) * DEG,
    M:  (p.el[3] + p.rate[3] * T - (p.el[4] + p.rate[4] * T)) * DEG,
  };
}
// 3D heliocentric ecliptic position [x,y,z] in AU for mean anomaly M
function eclPos(el, M) {
  M = ((M % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
  return eclPosE(el, solveKepler(M, el.e));
}
// same, but from eccentric anomaly (uniform-E sampling keeps ellipses smooth)
function eclPosE(el, E) {
  const xp = el.a * (Math.cos(E) - el.e);
  const yp = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
  const cw = Math.cos(el.w),  sw = Math.sin(el.w);
  const cn = Math.cos(el.ln), sn = Math.sin(el.ln);
  const ci = Math.cos(el.I),  si = Math.sin(el.I);
  return [
    (cw * cn - sw * sn * ci) * xp + (-sw * cn - cw * sn * ci) * yp,
    (cw * sn + sw * cn * ci) * xp + (-sw * sn + cw * cn * ci) * yp,
    (sw * si) * xp + (cw * si) * yp,
  ];
}
// ecliptic [x,y,z] (AU) -> three.js Vector3 in world units (y = ecliptic north)
function eclToScene(v, out = new THREE.Vector3()) {
  return out.set(v[0] * AU_U, v[2] * AU_U, -v[1] * AU_U);
}
function eclDirToScene(v, out = new THREE.Vector3()) {
  return out.set(v[0], v[2], -v[1]).normalize();
}
function poleVector(pole) {
  if (!pole) return [0, 0, 1];
  const lon = pole.lon * DEG, lat = pole.lat * DEG;
  return [Math.cos(lat) * Math.cos(lon), Math.cos(lat) * Math.sin(lon), Math.sin(lat)];
}

});

scene.add(sysLight.target);

{

const helioStatics = [];
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
function makeDiskBelt(n, rInAU, rOutAU, rel) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = (rInAU + Math.random() * (rOutAU - rInAU)) * AU_U;
    const th = Math.random() * 2 * Math.PI;
    pos[i * 3] = a * Math.cos(th);
    pos[i * 3 + 1] = a * rel * gauss();     // vertical scatter ~ inclination spread
    pos[i * 3 + 2] = a * Math.sin(th);
  }
  return pos;
}
function makeShell(n, rInAU, rOutAU) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * 2 * Math.PI;
    const s = Math.sqrt(1 - u * u);
    const r = (rInAU + (rOutAU - rInAU) * Math.pow(Math.random(), 2)) * AU_U;
    pos[i * 3] = r * s * Math.cos(t); pos[i * 3 + 1] = r * u; pos[i * 3 + 2] = r * s * Math.sin(t);
  }

}

/* --- planet orbit lines ---
   Resampled every frame with vertices clustered around the planet's
   current position (one vertex lands exactly on the planet), so the
   line hugs the true ellipse even at extreme zoom — uniform sampling
   leaves visible chord gaps that make planets look off their orbit. */
const ORBIT_SEGS = 512;
const CLUSTER = 0.97;   // 0 = uniform spacing; →1 = strongly densified at the planet
const orbitLines = PLANETS.map(p => {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position",
    new THREE.BufferAttribute(new Float32Array((ORBIT_SEGS + 1) * 3), 3));
  const line = new THREE.Line(geo,
    new THREE.LineBasicMaterial({ color: 0x96a0be, transparent: true,
                                  opacity: p.dwarf ? 0.14 : 0.3 }));
  line.frustumCulled = false;   // positions mutate each frame; skip stale bounds
  scene.add(line);
  return line;
});
const orbitV = new THREE.Vector3();
function updateOrbitLines(T) {
  PLANETS.forEach((p, i) => {
    const el = elementsAt(p, T);
    const M = ((el.M % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
    const Ep = solveKepler(M, el.e);
    const attr = orbitLines[i].geometry.attributes.position;
    for (let j = 0; j <= ORBIT_SEGS; j++) {
      const t = j / ORBIT_SEGS;
      const E = Ep + 2 * Math.PI * t - CLUSTER * Math.sin(2 * Math.PI * t);
      eclToScene(eclPosE(el, E), orbitV);
      attr.setXYZ(j, orbitV.x, orbitV.y, orbitV.z);
    }
    attr.needsUpdate = true;
  });
}

  const prev = focus;

    if (b.kind === "sun") dist = 2600;
    else if (b.kind === "rocket") dist = kmU(1200);
    else if (b.kind === "moon") dist = b.effR * 12;
    else dist = b.planet.moons ? b.planet.systemRadiusU * 2.6 : b.effR * 18;
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(dir.multiplyScalar(dist));

/* ============================================================
   Rocket launch simulation
   Geocentric frame, scene axes, km & seconds. Parametric ascent
   to a circular parking orbit, then RK4 integration under
   Earth + Moon + Sun gravity. The TLI burn is auto-targeted:
   burn when the parking-orbit position is opposite the Moon's
   in-plane direction at arrival time, ΔV from the vis-viva
   transfer ellipse. Visualization-grade, not mission-grade.
   ============================================================ */
const MU_E = 398600.4418, MU_M = 4902.800066, MU_S2 = 1.32712440018e11; // km³/s²
const R_EARTH = 6371;
const R_ENTRY = R_EARTH + 100;   // atmospheric entry interface (~100 km) = reentry
const earthP = PLANETS.find(p => p.name === "Earth");
const lunaM = earthP.moons[0];
let mission = null;

function greenwichAt(d, out) {
  const era = 2 * Math.PI * (0.7790572732640 + 1.00273781191135448 * d);
  return out.copy(equinoxDir).multiplyScalar(Math.cos(era))
            .addScaledVector(earthEast, Math.sin(era));
}
function moonGeoKm(d, out) {
  const ang = (lunaM.phase + lunaM.rate * d) * DEG;
  return out.copy(earthP.moonU).multiplyScalar(lunaM.aKm * Math.cos(ang))
            .addScaledVector(earthP.moonV, lunaM.aKm * Math.sin(ang));
}
function sunGeoKm(d, out) {
  const el = elementsAt(earthP, d / 36525);
  const xyz = eclPos(el, el.M);
  return out.set(-xyz[0] * AU_KM, -xyz[2] * AU_KM, xyz[1] * AU_KM);
}
// launch-site direction (unit) in inertial scene axes for a given epoch
function siteDir(d, latR, lonR, out, tmpG, tmpE) {
  greenwichAt(d, tmpG);
  tmpE.crossVectors(earthPole, tmpG); // east of the prime meridian
  return out.copy(tmpG).multiplyScalar(Math.cos(latR) * Math.cos(lonR))
            .addScaledVector(tmpE, Math.cos(latR) * Math.sin(lonR))
            .addScaledVector(earthPole, Math.sin(latR)).normalize();
}

const accM = new THREE.Vector3(), accS = new THREE.Vector3(), accD = new THREE.Vector3();
function accel(d, p, out) {
  const r2 = p.lengthSq(), r = Math.sqrt(r2);
  out.copy(p).multiplyScalar(-MU_E / (r2 * r));
  moonGeoKm(d, accM);
  accD.copy(accM).sub(p);
  const dm = accD.length(), rm = accM.length();
  out.addScaledVector(accD, MU_M / (dm * dm * dm))
     .addScaledVector(accM, -MU_M / (rm * rm * rm));
  sunGeoKm(d, accS);
  accD.copy(accS).sub(p);
  const ds = accD.length(), rs = accS.length();
  out.addScaledVector(accD, MU_S2 / (ds * ds * ds))
     .addScaledVector(accS, -MU_S2 / (rs * rs * rs));
  return out;
}

// shift launch time within ±12 h so the parking-orbit plane contains the Moon
// at arrival — like a real launch window; the plane is set by the pad's
// inertial position, which rotates with Earth through the day
function bestLaunchWindow(cfg) {
  const G = new THREE.Vector3(), E = new THREE.Vector3(), rh = new THREE.Vector3(),
        ea = new THREE.Vector3(), no = new THREE.Vector3(), dh = new THREE.Vector3(),
        wv = new THREE.Vector3(), mv = new THREE.Vector3();
  const latR = cfg.lat * DEG, lonR = cfg.lon * DEG, azR = cfg.az * DEG;
  const tArr = cfg.ascentSec + 3 * 3600 + 4.97 * 86400;  // ≈ ascent + short loiter + transfer
  // the plane sweeps past the Moon's direction twice a day — return both windows
  const mins = [];   // local minima of plane error: {ms, err}
  let prev = Infinity, prevMs = 0, rising = true;
  for (let off = -12 * 3600; off <= 12 * 3600; off += 120) {
    const ms = cfg.launchMs + off * 1000, d0 = daysSinceJ2000(ms);
    siteDir(d0, latR, lonR, rh, G, E);
    ea.crossVectors(earthPole, rh).normalize();
    no.crossVectors(rh, ea).normalize();
    dh.copy(ea).multiplyScalar(Math.sin(azR)).addScaledVector(no, Math.cos(azR));
    wv.crossVectors(rh, dh).normalize();
    moonGeoKm(d0 + tArr / 86400, mv).normalize();
    const err = Math.abs(wv.dot(mv));
    if (err < prev) rising = false;
    else { if (!rising) mins.push({ ms: prevMs, err: prev }); rising = true; }
    prev = err; prevMs = ms;
  }
  mins.sort((a, b) => a.err - b.err);
  return mins.slice(0, 2).map(m => m.ms);
}

function computeTrajectory(cfg) {
  const d0 = daysSinceJ2000(cfg.launchMs);
  const latR = cfg.lat * DEG, lonR = cfg.lon * DEG, azR = cfg.az * DEG;
  const V = () => new THREE.Vector3();
  const rhat = siteDir(d0, latR, lonR, V(), V(), V());
  const east = V().crossVectors(earthPole, rhat).normalize();
  const north = V().crossVectors(rhat, east).normalize();
  const dhat = V().copy(east).multiplyScalar(Math.sin(azR))
                  .addScaledVector(north, Math.cos(azR)).normalize();
  const rp = R_EARTH + cfg.altKm;
  const thetaTot = 22 * DEG;          // downrange angle at orbital insertion
  const Ta = cfg.ascentSec;
  function ascentPos(t, out) {
    const s = Math.min(Math.max(t / Ta, 0), 1);
    const h = cfg.altKm * s * s * (3 - 2 * s);
    const th = thetaTot * s * s;
    return out.copy(rhat).multiplyScalar(Math.cos(th))
              .addScaledVector(dhat, Math.sin(th)).multiplyScalar(R_EARTH + h);
  }

  const ts = [], px = [], py = [], pz = [];
  const pushSample = (t, p) => { ts.push(t); px.push(p.x); py.push(p.y); pz.push(p.z); };
  const w = V();
  for (let t = 0; t < Ta; t += 5) pushSample(t, ascentPos(t, w));

  // orbital insertion: circular velocity along the ascent tangent
  const pos = ascentPos(Ta, V());
  const that = V().copy(rhat).multiplyScalar(-Math.sin(thetaTot))
                  .addScaledVector(dhat, Math.cos(thetaTot)).normalize();
  const vCirc = Math.sqrt(MU_E / rp);
  const vel = V().copy(that).multiplyScalar(vCirc);
  pushSample(Ta, pos);

  const events = { insertion: Ta, tli: -1, dv: 0, closestMoonKm: Infinity,
                   closestMoonT: -1, rb: -1, rbDv: 0, end: Infinity, ended: "flying" };

  // --- TLI targeting: burn time & ΔV refined against real propagated flybys ---
  if (cfg.tli) {
    const n = Math.sqrt(MU_E / (rp * rp * rp));   // parking mean motion, rad/s
    const rhatI = V().copy(pos).normalize();
    const wHat = V().crossVectors(pos, vel).normalize();
    let ra = 384400, Ttr = 0;
    for (let i = 0; i < 3; i++) {                 // converge transfer time vs Moon distance
      const a = (rp + ra) / 2;
      Ttr = Math.PI * Math.sqrt(a * a * a / MU_E);
      ra = moonGeoKm(d0 + (Ta + Ttr) / 86400, w).length();
    }
    const dv0 = Math.sqrt(MU_E * (2 / rp - 2 / (rp + ra))) - vCirc;

    function parkingState(tb, pOut, vOut) {
      const th = n * (tb - Ta);
      pOut.copy(rhatI).multiplyScalar(Math.cos(th)).addScaledVector(that, Math.sin(th)).multiplyScalar(rp);
      vOut.copy(rhatI).multiplyScalar(-Math.sin(th)).addScaledVector(that, Math.cos(th)).multiplyScalar(vCirc);
    }
    const sp = V(), sv = V(), svn = V(), smm = V();
    // coarse propagation → lunar perilune + post-flyby Earth perigee
    function flybyMetrics(tb, dv) {
      parkingState(tb, sp, sv);
      svn.copy(sv).normalize();
      sv.addScaledVector(svn, dv);
      let t = tb, moonMin = Infinity, tMoonMin = 0, earthMin = Infinity, farSide = false;
      while (t < tb + 12 * 86400) {
        const nearMoon = sp.distanceTo(moonGeoKm(d0 + t / 86400, smm)) < 40000;
        const h = nearMoon ? 60 : 240;
        rkStep(sp, sv, d0 + t / 86400, h);
        t += h;
        const md = sp.distanceTo(moonGeoKm(d0 + t / 86400, smm));
        if (md < moonMin) {
          moonMin = md; tMoonMin = t;
          farSide = sp.length() > smm.length();   // beyond the Moon as seen from Earth
        }
        const r = sp.length();
        const pastFlyby = moonMin < 60000 && t > tMoonMin + 3600;
        if (pastFlyby && r < earthMin) earthMin = r;
        if (r < R_EARTH) { earthMin = r; break; }
        if (pastFlyby && r > 480000) break;   // heading out again, no direct return
      }
      return { peri: moonMin, ret: earthMin, farSide };
    }
    // free-return objective: perilune in a 3,000–16,000 km band AND a return
    // perigee at the top of Earth's atmosphere; loiter is penalized so the
    // burn happens within the first orbits, like a real mission
    const LOITER_PENALTY = 0.012;   // km of score per second of parking time
    function flybyScore(tb, dv) {
      const f = flybyMetrics(tb, dv);
      let s = Math.max(0, f.peri - 16000) + Math.max(0, 3000 - f.peri);
      s += f.ret < Infinity ? 0.5 * Math.abs(f.ret - 6450) : 20000;
      s += (tb - Ta) * LOITER_PENALTY;
      if (!f.farSide) s += 8000;   // must round the far side, like the real figure-8
      return s;
    }

    // analytic sweep over up to 4 days of loiter (longer and the analytic
    // parking model drifts from the real perturbed orbit): combined in-plane
    // + out-of-plane miss estimate; collect local minima as candidates
    const mAt = V(), mIn = V(), rT = V();
    const cands = [];
    let prevEst = Infinity, prevTb = 0, rising = true;
    for (let tb = Ta + 600; tb < Ta + 4 * 86400; tb += 30) {
      moonGeoKm(d0 + (tb + Ttr) / 86400, mAt);
      const outMiss = Math.abs(mAt.dot(wHat));
      mIn.copy(mAt).addScaledVector(wHat, -mAt.dot(wHat)).normalize();
      const th = n * (tb - Ta);
      rT.copy(rhatI).multiplyScalar(Math.cos(th)).addScaledVector(that, Math.sin(th));
      const est = Math.hypot(rT.angleTo(mIn.negate()) * mAt.length(), outMiss);
      if (est < prevEst) rising = false;
      else { if (!rising) cands.push({ tb: prevTb, est: prevEst }); rising = true; }
      prevEst = est; prevTb = tb;
    }
    cands.sort((a, b) => (a.est + (a.tb - Ta) * 0.05) - (b.est + (b.tb - Ta) * 0.05));

    // numeric refinement toward a close flyby with a free return to Earth
    let best = { score: Infinity, tb: Ta + 600, dv: dv0 };
    let evals = 0;
    for (const c of cands.slice(0, 4)) {
      let tb = c.tb, dv = dv0;
      let score = flybyScore(tb, dv);
      for (const [dT, dDv] of [[600, 0.03], [150, 0.01], [40, 0.003], [10, 0.001]]) {
        for (let pass = 0; pass < 5 && evals < 160; pass++) {
          let improved = false;
          for (const [a, b] of [[dT, 0], [-dT, 0], [0, dDv], [0, -dDv]]) {
            const sc = flybyScore(tb + a, dv + b);
            evals++;
            if (sc < score) { score = sc; tb += a; dv += b; improved = true; }
          }
          if (!improved) break;
        }
      }
      if (score < best.score) best = { score, tb, dv };
    }

    // final refinement against the *real* propagated trajectory — flybys are
    // chaotic, so the burn must be exact in the same integrator the mission
    // uses. Cache the true parking arc around the chosen window, then tune.
    {
      const lo = best.tb - 1800, hi = best.tb + 1800;
      const arc = [];
      const ap = pos.clone(), av = vel.clone();
      let t = Ta;
      while (t < hi) {
        rkStep(ap, av, d0 + t / 86400, 10);
        t += 10;
        if (t >= lo) arc.push({ t, p: ap.clone(), v: av.clone() });
      }
      const tp = V(), tv = V(), tvn = V(), tmm = V();
      const arcAt = tb => arc[Math.min(arc.length - 1, Math.max(0, Math.round((tb - arc[0].t) / 10)))];
      function trueScore(tb, dv) {
        const e0 = arcAt(tb);
        tp.copy(e0.p); tv.copy(e0.v);
        tvn.copy(tv).normalize();
        tv.addScaledVector(tvn, dv);
        let tt = e0.t, moonMin = Infinity, tMoonMin = 0, earthMin = Infinity, md = Infinity, farSide = false;
        while (tt < e0.t + 12 * 86400) {
          const r = tp.length();
          let h = r < 20000 ? 10 : r < 100000 ? 60 : 240;
          if (md < 60000) h = Math.min(h, 60);
          rkStep(tp, tv, d0 + tt / 86400, h);
          tt += h;
          md = tp.distanceTo(moonGeoKm(d0 + tt / 86400, tmm));
          if (md < moonMin) { moonMin = md; tMoonMin = tt; farSide = tp.length() > tmm.length(); }
          const r2 = tp.length();
          const past = moonMin < 60000 && tt > tMoonMin + 3600;
          if (past && r2 < earthMin) earthMin = r2;
          if (r2 < R_EARTH) { earthMin = r2; break; }
          if (past && r2 > 480000) break;
        }
        let s = Math.max(0, moonMin - 16000) + Math.max(0, 3000 - moonMin);
        s += earthMin < Infinity ? 0.5 * Math.abs(earthMin - 6450) : 20000;
        s += (tb - Ta) * LOITER_PENALTY;
        if (!farSide) s += 8000;
        return s;
      }
      let tb = arcAt(best.tb).t, dv = best.dv;
      let score = trueScore(tb, dv);
      for (const [dT, dDv] of [[120, 0.01], [30, 0.003], [10, 0.001]]) {
        for (let pass = 0; pass < 6; pass++) {
          let improved = false;
          for (const [a, b] of [[dT, 0], [-dT, 0], [0, dDv], [0, -dDv]]) {
            const sc = trueScore(tb + a, dv + b);
            if (sc < score) { score = sc; tb += a; dv += b; improved = true; }
          }
          if (!improved) break;
        }
      }
      best.tb = arcAt(tb).t;
      best.dv = dv;
    }
    events.tli = best.tb;
    events.dv = best.dv;

    // --- automatic return-correction burn ---
    // A passive free return only works when geometry allows it; otherwise the
    // post-flyby orbit's perigee stays above the atmosphere and the ship loops
    // out again. Like the real mission, fire a retrograde burn a few hours
    // after the flyby (near apogee, where it's most efficient) and bisect its
    // ΔV so the return perigee drops into the atmosphere — guaranteeing reentry.
    const pp = V(), pv = V(), pw = V(), pmm = V();
    // The return burn must fire on the descending leg AFTER the ship has left
    // the Moon's vicinity (burning near the Moon is chaotic and inefficient at
    // near-zero speed). RB_ALT km is a clean two-body point on the way down.
    const RB_ALT = 150000;
    function probeReturn(rbT, rbDv) {
      pp.copy(pos); pv.copy(vel);
      let t = Ta, tliDone = false, rbDone = !(rbT > 0);
      let cmT = 0, cm = Infinity, reentered = false, perigee = Infinity;
      let sawFlyby = false, prevR = Infinity, descended = false, descCrossT = 0;
      while (t < Ta + 20 * 86400) {
        const r = pp.length();
        let h = r < 20000 ? 10 : r < 120000 ? 90 : 400;
        if (cm < 60000 && !sawFlyby) h = Math.min(h, 60);
        if (!tliDone && t < best.tb && t + h > best.tb) h = best.tb - t;
        if (tliDone && !rbDone && t < rbT && t + h > rbT) h = rbT - t;
        rkStep(pp, pv, d0 + t / 86400, h);
        t += h;
        if (!tliDone && Math.abs(t - best.tb) < 0.6) {
          pw.copy(pv).normalize(); pv.addScaledVector(pw, best.dv); tliDone = true;
        }
        if (tliDone && !rbDone && Math.abs(t - rbT) < 0.6) {
          pw.copy(pv).normalize(); pv.addScaledVector(pw, rbDv); rbDone = true;
        }
        const md = pp.distanceTo(moonGeoKm(d0 + t / 86400, pmm));
        if (md < cm) { cm = md; cmT = t; }
        const r2 = pp.length();
        const past = cm < 60000 && t > cmT + 3600;   // only after a real flyby
        if (past) {
          sawFlyby = true;
          if (descCrossT === 0 && r2 < RB_ALT) descCrossT = t;   // descending-leg burn point
          perigee = Math.min(perigee, r2);
          if (r2 < prevR) descended = true;
        }
        if (r2 < R_ENTRY) { reentered = true; break; }
        if (past && descended && r2 > prevR + 800) break;   // post-flyby perigee passed
        prevR = r2;
      }
      return { cmT, reentered, perigee, descCrossT };
    }

    const base = probeReturn(-1, 0);
    if (!base.reentered && base.descCrossT > 0) {
      const rbT = base.descCrossT;
      let lo = 0, hi = 1.2;
      // smallest retrograde ΔV that brings the ship to atmospheric reentry
      if (probeReturn(rbT, -hi).reentered) {   // a return is reachable
        for (let i = 0; i < 18; i++) {
          const mid = (lo + hi) / 2;
          if (probeReturn(rbT, -mid).reentered) hi = mid; else lo = mid;
        }
        events.rb = rbT;
        events.rbDv = -hi;
      }
    }
  }

  const m = { cfg, d0, launchMs: cfg.launchMs, ts, px, py, pz, events, latR, lonR,
              name: cfg.name || "Rocket",
              state: { p: pos.clone(), v: vel.clone(), t: Ta,
                       burnDone: !cfg.tli, rbDone: false, md: Infinity } };
  // cover the whole journey home when a return burn is planned, even past the
  // requested duration, so the trip completes instead of freezing mid-flight
  const planDays = Math.max(cfg.days, events.rb > 0 ? events.rb / 86400 + 5 : 0);
  propagateTo(m, planDays * 86400);
  if (m.events.ended === "flying") propagateTo(m, (planDays + 3) * 86400);
  return m;
}

// shared RK4 step (mutates p, v in place); dDays = days since J2000 at step start
const rkA1 = new THREE.Vector3(), rkA2 = new THREE.Vector3(), rkA3 = new THREE.Vector3(), rkA4 = new THREE.Vector3();
const rkP2 = new THREE.Vector3(), rkV2 = new THREE.Vector3(), rkP3 = new THREE.Vector3();
const rkV3 = new THREE.Vector3(), rkP4 = new THREE.Vector3(), rkV4 = new THREE.Vector3();
function rkStep(p, v, dDays, h) {
  const hd = h / 86400;
  accel(dDays, p, rkA1);
  rkP2.copy(p).addScaledVector(v, h / 2);    rkV2.copy(v).addScaledVector(rkA1, h / 2);
  accel(dDays + hd / 2, rkP2, rkA2);
  rkP3.copy(p).addScaledVector(rkV2, h / 2); rkV3.copy(v).addScaledVector(rkA2, h / 2);
  accel(dDays + hd / 2, rkP3, rkA3);
  rkP4.copy(p).addScaledVector(rkV3, h);     rkV4.copy(v).addScaledVector(rkA3, h);
  accel(dDays + hd, rkP4, rkA4);
  p.addScaledVector(v, h / 6).addScaledVector(rkV2, h / 3)
   .addScaledVector(rkV3, h / 3).addScaledVector(rkV4, h / 6);
  v.addScaledVector(rkA1, h / 6).addScaledVector(rkA2, h / 3)
   .addScaledVector(rkA3, h / 3).addScaledVector(rkA4, h / 6);
}

const MISSION_CAP = 120 * 86400;   // ceiling on auto-extended integration
const propW = new THREE.Vector3();
function propagateTo(m, tEnd) {
  const st = m.state, e = m.events;
  tEnd = Math.min(tEnd, MISSION_CAP);
  while (st.t < tEnd && e.ended === "flying") {
    const r = st.p.length();
    let h = r < 20000 ? 10 : r < 100000 ? 60 : 240;
    if (st.md < 60000) h = Math.min(h, 60);   // fine steps near the Moon
    if (!st.burnDone && st.t < e.tli && st.t + h > e.tli) h = e.tli - st.t;
    if (st.burnDone && !st.rbDone && e.rb > 0 && st.t < e.rb && st.t + h > e.rb) h = e.rb - st.t;
    rkStep(st.p, st.v, m.d0 + st.t / 86400, h);
    st.t += h;
    if (!st.burnDone && Math.abs(st.t - e.tli) < 0.5) {
      propW.copy(st.v).normalize();
      st.v.addScaledVector(propW, e.dv);
      st.burnDone = true;
    }
    if (st.burnDone && !st.rbDone && e.rb > 0 && Math.abs(st.t - e.rb) < 0.5) {
      propW.copy(st.v).normalize();
      st.v.addScaledVector(propW, e.rbDv);   // retrograde return-correction burn
      st.rbDone = true;
    }
    m.ts.push(st.t); m.px.push(st.p.x); m.py.push(st.p.y); m.pz.push(st.p.z);
    st.md = st.p.distanceTo(moonGeoKm(m.d0 + st.t / 86400, propW));
    if (st.md < e.closestMoonKm) { e.closestMoonKm = st.md; e.closestMoonT = st.t; }
    if (st.p.length() < R_ENTRY) {
      e.end = st.t; e.ended = "reentry";
      // landing point in Earth-fixed coordinates, so the craft rides the rotating Earth
      greenwichAt(m.d0 + st.t / 86400, sdG);
      sdE.crossVectors(earthPole, sdG);
      propW.copy(st.p).normalize();
      e.landLat = Math.asin(Math.min(Math.max(propW.dot(earthPole), -1), 1));
      e.landLon = Math.atan2(propW.dot(sdE), propW.dot(sdG));
    }
  }
  if (st.t >= MISSION_CAP && e.ended === "flying") e.ended = "capped";
}

// geocentric position (km) at τ seconds after launch
const sdG = new THREE.Vector3(), sdE = new THREE.Vector3();
function missionPosKm(m, tau, out) {
  if (tau <= 0) {
    return siteDir(m.d0 + tau / 86400, m.latR, m.lonR, out, sdG, sdE).multiplyScalar(R_EARTH);
  }
  if (m.events.ended === "reentry" && tau >= m.events.end) {
    // splashed down: ride the rotating Earth at the landing point
    return siteDir(m.d0 + tau / 86400, m.events.landLat, m.events.landLon, out, sdG, sdE)
           .multiplyScalar(R_EARTH);
  }
  const ts = m.ts;
  if (tau >= ts[ts.length - 1]) tau = ts[ts.length - 1];
  let lo = 0, hi = ts.length - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (ts[mid] <= tau) lo = mid; else hi = mid; }
  const f = (tau - ts[lo]) / (ts[hi] - ts[lo] || 1);
  return out.set(m.px[lo] + (m.px[hi] - m.px[lo]) * f,
                 m.py[lo] + (m.py[hi] - m.py[lo]) * f,
                 m.pz[lo] + (m.pz[hi] - m.pz[lo]) * f);
}
function missionPhase(m, tau) {
  const e = m.events;
  if (tau < 0) return "on the pad, T−" + fmt(Math.ceil(-tau), 0) + " s";
  if (tau <= e.insertion) return "ascent";
  if (e.ended === "reentry" && tau >= e.end) return "splashdown — mission complete";
  if (e.ended === "capped" && tau >= m.ts[m.ts.length - 1]) return "adrift (sim limit reached)";
  if (e.tli < 0) return "in Earth orbit";
  if (tau < e.tli) return "parking orbit";
  if (tau < e.closestMoonT) return "translunar coast";
  if (e.rb > 0 && Math.abs(tau - e.rb) < 60) return "return-correction burn";
  return "return cruise";
}

/* --- mission path line --- */
let missionLine = null;
function setMissionLine(m) {
  if (missionLine) { scene.remove(missionLine); missionLine.geometry.dispose(); missionLine = null; }
  if (!m) return;
  const stride = Math.max(1, Math.floor(m.ts.length / 8000));
  const npts = Math.floor((m.ts.length - 1) / stride) + 1;
  const arr = new Float32Array(npts * 3);
  for (let i = 0, j = 0; i < m.ts.length; i += stride, j++) {
    arr[j * 3] = kmU(m.px[i]); arr[j * 3 + 1] = kmU(m.py[i]); arr[j * 3 + 2] = kmU(m.pz[i]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(arr, 3));
  missionLine = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0x6ea8ff, transparent: true, opacity: 0.55 }));
  missionLine.frustumCulled = false;
  scene.add(missionLine);
}

/* --- launch panel wiring --- */
const lEl = id => document.getElementById(id);
function fillArtemis() {
  lEl("l-date").value = "2026-04-01T18:36";   // Artemis II launch: April 1, 2026
  lEl("l-lat").value = 28.573;   // Kennedy LC-39B
  lEl("l-lon").value = -80.649;
  lEl("l-az").value = 90;
  lEl("l-alt").value = 185;
  lEl("l-asc").value = 510;
  lEl("l-tli").checked = true;
  lEl("l-win").checked = true;
  lEl("l-days").value = 10;
  lEl("l-status").textContent = "Artemis II loaded — free-return flight around the Moon. Press Launch.";
}
lEl("l-artemis").addEventListener("click", () => { fillArtemis(); lEl("l-artemis").dataset.loaded = "1"; });
lEl("l-clear").addEventListener("click", () => {
  mission = null;
  setMissionLine(null);
  rocketBody.hidden = true;
  rocketBody.mesh.visible = false;
  lEl("l-status").textContent = "";
  if (focus === rocketBody) focusOn(sunBody);
});
lEl("l-launch").addEventListener("click", () => {
  const dateVal = lEl("l-date").value;
  if (!dateVal) { lEl("l-status").textContent = "Set a launch time first (or load Artemis II)."; return; }
  const cfg = {
    launchMs: new Date(dateVal).getTime(),
    lat: parseFloat(lEl("l-lat").value) || 0,
    lon: parseFloat(lEl("l-lon").value) || 0,
    az: parseFloat(lEl("l-az").value) || 90,
    altKm: Math.max(parseFloat(lEl("l-alt").value) || 185, 120),
    ascentSec: Math.max(parseFloat(lEl("l-asc").value) || 510, 120),
    tli: lEl("l-tli").checked,
    window: lEl("l-win").checked,
    days: Math.min(Math.max(parseFloat(lEl("l-days").value) || 10, 0.1), 60),
    name: lEl("l-artemis").dataset.loaded === "1" ? "Artemis II" : "Rocket",
  };
  const requestedMs = cfg.launchMs;
  mission = computeTrajectory(cfg);
  if (cfg.tli && cfg.window) {
    // also try the plane-aligned launch windows; keep whichever flyby is best
    // (free return first, then close pass, then shortest parking loiter)
    const score = m => {
      const e = m.events, peri = e.closestMoonKm;
      return (e.ended === "reentry" ? 0 : 50000) +
             Math.max(0, peri - 16000) + Math.max(0, 3000 - peri) +
             (e.tli > 0 ? (e.tli - e.insertion) * 0.012 : 0);
    };
    for (const winMs of bestLaunchWindow(cfg)) {
      if (Math.abs(winMs - requestedMs) < 60000) continue;
      const alt = computeTrajectory({ ...cfg, launchMs: winMs });
      if (score(alt) < score(mission)) { mission = alt; cfg.launchMs = winMs; }
    }
  }
  setMissionLine(mission);
  rocketBody.hidden = false;
  rocketBody.mesh.visible = true;
  rocketBody.label.textContent = mission.name;
  rocketBody.name = mission.name;
  const e = mission.events;
  const fmtT = sec => sec > 172800 ? fmt(sec / 86400, 1) + " d"
                    : sec > 7200 ? fmt(sec / 3600, 1) + " h" : fmt(sec / 60, 0) + " min";
  let s = "";
  if (cfg.launchMs !== requestedMs) {
    const dt = new Date(cfg.launchMs);
    lEl("l-date").value = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000)
                          .toISOString().slice(0, 16);
    s += `Launch window: ${dt.toLocaleString(undefined,
         { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}. `;
  }
  s += `Orbit insertion T+${fmt(e.insertion / 60, 1)} min.`;
  if (e.tli > 0) {
    s += ` TLI burn T+${fmtT(e.tli)}, ΔV ${fmt(e.dv, 2)} km/s.` +
         ` Closest lunar approach ${fmt(e.closestMoonKm, 0)} km at T+${fmt(e.closestMoonT / 86400, 1)} d.`;
    if (e.rb > 0) s += ` Return burn T+${fmtT(e.rb)}, ΔV ${fmt(Math.abs(e.rbDv), 2)} km/s.`;
  }
  if (e.ended === "reentry") s += ` Reentry at T+${fmt(e.end / 86400, 1)} d.`;
  else if (e.tli > 0) s += " No free return this window — after the flyby the ship coasts on a long Earth orbit.";
  lEl("l-status").textContent = s;
  simTime = cfg.launchMs - 30000;   // jump to T−30 s; use the speed buttons to watch
  focusOn(rocketBody);
});

/* --- ?focus=Name[&dist=km] deep link: fly there on load, arriving on the sunlit side --- */
const urlParams = new URLSearchParams(location.search);
const urlFocusName = urlParams.get("focus");
const urlDistKm = parseFloat(urlParams.get("dist"));
let pendingFocus = urlFocusName
  ? bodies.find(b => b.name.toLowerCase() === urlFocusName.toLowerCase()) || null
  : null;

/* --- picking on the canvas (screen-space nearest body) --- */
let downPos = null;
renderer.domElement.addEventListener("pointerdown", e => { downPos = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
  downPos = null;
  if (moved > 5) return;
  let best = null, bestD = 26;
  for (const b of bodies) {
    if (b.screen && b.screen.visible) {
      const d = Math.hypot(b.screen.x - e.clientX, b.screen.y - e.clientY) - b.screen.r;
      if (d < bestD) { bestD = d; best = b; }
    }
  }
  if (best) focusOn(best);
  else infoEl.style.display = "none";
});

/* --- simulation time + HUD --- */
let simTime = Date.now();
let speed = 1;
let lastFrame = performance.now();
const clockText = document.getElementById("clock-text");
const clockEl = document.getElementById("clock");
document.querySelectorAll("#speed-group .btn").forEach(b => {
  b.addEventListener("click", () => {
    speed = Number(b.dataset.speed);
    document.querySelectorAll("#speed-group .btn").forEach(x => x.classList.toggle("active", x === b));
    clockEl.classList.toggle("warped", speed !== 1);
  });
});
document.getElementById("btn-now").addEventListener("click", () => { simTime = Date.now(); });

const roFocus = document.getElementById("readout-focus");
const roDist = document.getElementById("readout-dist");

/* --- main loop --- */
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
let infoTick = 0;

const mpK = new THREE.Vector3(), mpK2 = new THREE.Vector3();
const mpDir = new THREE.Vector3(), mpScene = new THREE.Vector3();
const upY = new THREE.Vector3(0, 1, 0);
function updateMission() {
  const tau = (simTime - mission.launchMs) / 1000;
  // extend the integration on demand so the craft never freezes mid-flight
  const lastT = mission.ts[mission.ts.length - 1];
  if (mission.events.ended === "flying" && tau > lastT - 3600) {
    propagateTo(mission, Math.max(tau + 86400, lastT + 5 * 86400));
    setMissionLine(mission);
  }
  missionPosKm(mission, tau, mpK);
  rocketBody.abs.set(earthBody.abs.x + kmU(mpK.x),
                     earthBody.abs.y + kmU(mpK.y),
                     earthBody.abs.z + kmU(mpK.z));
  // point the nose along the direction of motion (radial while on the pad)
  missionPosKm(mission, tau + 8, mpK2);
  mpDir.copy(mpK2).sub(mpK);
  if (tau < 0 || mpDir.lengthSq() < 1e-10) mpDir.copy(mpK); // upright on the pad
  if (mission.events.ended === "reentry" && tau >= mission.events.end) mpDir.copy(mpK); // upright after splashdown
  rocketBody.mesh.quaternion.setFromUnitVectors(upY, mpDir.normalize());
  // adaptive visual scale so the (real ~100 m) rocket stays visible at any zoom
  mpScene.copy(rocketBody.abs).sub(focus.abs);
  const cd = mpScene.distanceTo(camera.position);
  const s = Math.max(kmU(0.1), cd * 0.09);
  rocketBody.mesh.scale.setScalar(s);
  rocketBody.effR = s * 0.5;
  const e = mission.events;
  rocketBody.mesh.userData.flame.visible =
    (tau >= 0 && tau <= e.insertion) ||
    (e.tli > 0 && tau >= e.tli && tau <= e.tli + 180) ||
    (e.rb > 0 && tau >= e.rb && tau <= e.rb + 120);
}

function updatePositions(T, d) {
  for (const p of PLANETS) {
    const el = elementsAt(p, T);
    const xyz = eclPos(el, el.M);
    p.body.sunDistAU = Math.hypot(xyz[0], xyz[1], xyz[2]);
    eclToScene(xyz, p.body.abs);
    if (p.moons) {
      for (const m of p.moons) {
        const ang = (m.phase + m.rate * d) * DEG;
        m.body.abs.copy(p.body.abs)
          .addScaledVector(p.moonU, m.aU * Math.cos(ang))
          .addScaledVector(p.moonV, m.aU * Math.sin(ang));
      }
    }
  }
}

function updateLabels() {
  const w = window.innerWidth, h = window.innerHeight;
  // zoomed out past ~650 AU the planet labels all collapse onto the Sun — hide them
  const farOut = camera.position.distanceTo(controls.target) > 1e5;
  for (const b of bodies) {
    if (b.hidden) { b.screen = null; b.label.style.display = "none"; continue; }
    tmp.copy(b.abs).sub(focusCenter).sub(controls.target);
    const dist = tmp.length();
    tmp.copy(b.abs).sub(focusCenter).project(camera);
    const onScreen = tmp.z < 1 && tmp.x > -1.05 && tmp.x < 1.05 && tmp.y > -1.05 && tmp.y < 1.05;
    const x = (tmp.x + 1) / 2 * w, y = (1 - tmp.y) / 2 * h;
    // apparent pixel radius for picking
    const camDist = tmp2.copy(b.abs).sub(focusCenter).sub(camera.position).length();
    const pxR = (b.effR / camDist) * (h / 2) / Math.tan(camera.fov * DEG / 2);
    b.screen = { x, y, r: pxR, visible: onScreen };

    let show = onScreen && !(farOut && b.kind !== "sun");
    if (show && b.kind === "moon") {
      const ps = b.planet.body.screen;
      show = ps && Math.hypot(ps.x - x, ps.y - y) > 22 || focus === b;
    }
    b.label.style.display = show ? "block" : "none";
    if (show) b.label.style.transform = `translate(${x + 8}px, ${y - 7}px)`;
  }
}

function updateSysLight() {
  if (!sysLight.visible) return;
  const p = focus.planet;
  // light direction: from the Sun toward the focused planet
  const dir = tmp.copy(p.body.abs).normalize();
  const sysR = p.systemRadiusU * 1.1;
  const D = Math.max(sysR * 5, p.radiusU * 20);
  const focusScene = tmp2.copy(focus.abs).sub(focusCenter);
  sysLight.position.copy(focusScene).addScaledVector(dir, -D);
  sysLight.target.position.copy(focusScene);
  // adaptive shadow frustum: tighter when zoomed in -> crisper eclipse shadows
  const camDist = camera.position.distanceTo(controls.target);
  const planetSpan = focus.kind === "moon"
    ? focus.abs.distanceTo(p.body.abs) + p.body.effR * 1.2 : 0;
  const half = Math.min(Math.max(camDist * 1.5, focus.effR * 4, planetSpan), sysR * 1.6);
  const sc = sysLight.shadow.camera;
  sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half;
  sc.near = Math.max(D - sysR * 2, 0.001); sc.far = D + sysR * 2;
  sc.updateProjectionMatrix();
  sysLight.shadow.normalBias = Math.max(focus.effR, p.body.effR) * 0.02;
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(now - lastFrame, 100);
  lastFrame = now;
  simTime += dt * speed;

  const T = julianCenturies(simTime);
  const d = daysSinceJ2000(simTime);
  updateOrbitLines(T);
  updatePositions(T, d);
  if (mission) updateMission();

  if (pendingFocus) {        // deep link: positions are now known, fly there
    focusOn(pendingFocus);
    if (pendingFocus.kind !== "sun") {
      const dist = urlDistKm > 0 ? kmU(urlDistKm) : camera.position.length();
      camera.position.copy(pendingFocus.abs).normalize().multiplyScalar(-dist);
      camera.position.y += dist * 0.3;
    }
    pendingFocus = null;
  }

  focusCenter.copy(focus.abs);

  // place everything relative to the focus (floating origin: keeps precision)
  for (const b of bodies) {
    b.mesh.position.copy(b.abs).sub(focusCenter);
    if (b.orbitLine) b.orbitLine.position.copy(b.planet.body.abs).sub(focusCenter);
  }
  sunBody.glow.position.copy(sunBody.mesh.position);
  sunLight.position.copy(sunBody.mesh.position);
  // keep the Sun visibly bright from any distance
  const sunCamDist = sunBody.mesh.position.distanceTo(camera.position);
  sunBody.glow.scale.setScalar(Math.max(sunBody.effR * 14, sunCamDist * 0.045));
  for (const line of orbitLines) line.position.copy(focusCenter).negate();
  for (const pts of helioStatics) pts.position.copy(focusCenter).negate();
  if (missionLine) missionLine.position.copy(earthBody.abs).sub(focusCenter);

  updateEarthOrientation(d);
  if (earthClouds) earthClouds.rotation.y += dt * speed * 2e-9; // slow drift relative to surface
  if (luna) {  // tidal lock: keep the near side (texture lon 0 = local +X) pointed at Earth
    luna.mesh.rotation.y = Math.atan2(-(earthBody.abs.z - luna.abs.z),
                                      earthBody.abs.x - luna.abs.x);
  }
  updateSysLight();
  controls.update();
  updateLabels();

  // keep the info panel's live values (e.g. distance from Sun) fresh
  if (infoEl.style.display === "block" && !infoIsCustom &&
      (focus.kind === "rocket" || ++infoTick % 10 === 0)) showInfo(focus);

  // HUD
  const dte = new Date(simTime);
  clockText.textContent = dte.toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  const camDist = camera.position.distanceTo(controls.target);
  const au = camDist / AU_U;
  roFocus.textContent = "viewing " + focus.name;
  roDist.textContent = au >= 0.02
    ? `${fmt(au, 2)} AU away`
    : `${fmt(camDist * UNIT_KM, 0)} km away`;

  renderer.render(scene, camera);
}

applySizes();
applyLayers();
requestAnimationFrame(frame);

// debugging hooks
window.SG = { bodies, PLANETS, focusOn, camera, controls,
  get mission() { return mission; }, propagateTo, setMissionLine,
  get focus() { return focus; },
  set simTime(v) { simTime = v; }, get simTime() { return simTime; },
  setSpeed(v) { speed = v; } };
</script>
</body>
</html>
