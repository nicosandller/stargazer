<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stargazer — Live 3D Solar System</title>
<meta name="description" content="An explorable, real-time 3D model of the solar system at true scale. Planet and moon positions are computed for your current time.">
<style>
  :root {
    --ui-bg: rgba(10, 14, 26, 0.78);
    --ui-border: rgba(120, 150, 255, 0.18);
    --ui-text: #c9d4f0;
    --accent: #6ea8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #03050b; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ui-text); }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; }

  .label {
    position: fixed;
    font-size: 11px;
    color: rgba(201, 212, 240, 0.85);
    text-shadow: 0 0 4px #000, 0 0 2px #000;
    transform: translate(8px, -6px);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    z-index: 2;
  }
  .label:hover { color: #fff; }
  .label.moon { font-size: 10px; opacity: 0.8; }

  .panel {
    position: fixed;
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 10px 14px;
    user-select: none;
    z-index: 10;
  }
  #hud-top {
    top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 24px);
  }
  #clock { font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
  #clock .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #4ade80; margin-right: 6px; vertical-align: 1px;
    animation: pulse 2s ease-in-out infinite;
  }
  #clock.warped .live-dot { background: #fbbf24; animation: none; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  .btn {
    background: rgba(110, 168, 255, 0.12);
    border: 1px solid var(--ui-border);
    color: var(--ui-text);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(110, 168, 255, 0.25); }
  .btn.active { background: var(--accent); color: #04060d; border-color: var(--accent); }
  .btn-group { display: flex; gap: 4px; align-items: center; }
  .btn-group .lbl { font-size: 11px; opacity: 0.55; margin-right: 2px; }

  #info {
    bottom: 12px; left: 12px;
    max-width: 290px;
    font-size: 12.5px;
    line-height: 1.55;
    display: none;
  }
  #info h2 { font-size: 16px; margin-bottom: 4px; color: #fff; font-weight: 600; }
  #info .close { position: absolute; top: 6px; right: 10px; cursor: pointer; opacity: 0.6; font-size: 14px; }
  #info .close:hover { opacity: 1; }
  #info dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin-top: 6px; }
  #info dt { opacity: 0.55; }
  #info dd { font-variant-numeric: tabular-nums; }

  #sidebar {
    left: 12px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 2px;
    padding: 8px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }
  #sidebar .nav {
    display: flex; align-items: center; gap: 8px;
    background: transparent; border: none;
    color: var(--ui-text);
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 7px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
  }
  #sidebar .nav:hover { background: rgba(110, 168, 255, 0.18); }
  #sidebar .nav.active { background: rgba(110, 168, 255, 0.3); color: #fff; }
  #sidebar .nav .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
  }
  #sidebar hr {
    border: none; border-top: 1px solid var(--ui-border); margin: 5px 4px;
  }
  #hint {
    bottom: 12px; right: 12px;
    font-size: 11.5px;
    opacity: 0.75;
    text-align: right;
    line-height: 1.6;
    pointer-events: none;
  }
  #readout {
    top: 64px; right: 12px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    line-height: 1.5;
  }
  @media (max-width: 640px) {
    #hint { display: none; }
    #sidebar {
      top: auto; bottom: 12px; left: 12px; right: 12px; transform: none;
      flex-direction: row; overflow-x: auto; max-height: none;
    }
    #readout { top: auto; bottom: 70px; }
    #info { max-width: calc(100vw - 24px); bottom: 70px; }
  }
</style>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",

<div id="view"></div>

<div id="hud-top" class="panel">
  <span id="clock"><span class="live-dot"></span><span id="clock-text"></span></span>
  <span class="btn-group" id="speed-group">
    <button class="btn" data-speed="-86400">−1d/s</button>
    <button class="btn" data-speed="0">⏸</button>
    <button class="btn active" data-speed="1">Live</button>
    <button class="btn" data-speed="86400">+1d/s</button>
    <button class="btn" data-speed="2592000">+30d/s</button>
  </span>
  <button class="btn" id="btn-now">Now</button>
  <span class="btn-group" id="size-group">
    <span class="lbl">size</span>
    <button class="btn active" data-mult="1">real</button>
    <button class="btn" data-mult="10">×10</button>
    <button class="btn" data-mult="100">×100</button>
  </span>
</div>

<div id="sidebar" class="panel"></div>

<div id="readout" class="panel">
  <div id="readout-focus"></div>
  <div id="readout-dist"></div>
</div>

<div id="info" class="panel">
  <span class="close" id="info-close">✕</span>

  <div id="info-blurb"></div>
  <dl id="info-stats"></dl>
</div>

<div id="hint" class="panel">
  drag to orbit · scroll / pinch to zoom · right-drag to pan<br>

/* --- orbital mechanics (ecliptic frame, AU) --- */
function julianCenturies(ms) { return (ms / 86400000 + 2440587.5 - 2451545.0) / 36525; }
function daysSinceJ2000(ms)  { return ms / 86400000 + 2440587.5 - 2451545.0; }
function solveKepler(M, e) {
  let E = e > 0.8 ? Math.PI * Math.sign(M || 1) : M + e * Math.sin(M);
  for (let i = 0; i < 30; i++) {
    const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-9) break;
  }
  return E;
}
function elementsAt(p, T) {
  return {
    a:  p.el[0] + p.rate[0] * T,
    e:  p.el[1] + p.rate[1] * T,
    I:  (p.el[2] + p.rate[2] * T) * DEG,
    ln: (p.el[5] + p.rate[5] * T) * DEG,
    w:  (p.el[4] + p.rate[4] * T - (p.el[5] + p.rate[5] * T)) * DEG,
    M:  (p.el[3] + p.rate[3] * T - (p.el[4] + p.rate[4] * T)) * DEG,
  };
}
// 3D heliocentric ecliptic position [x,y,z] in AU for mean anomaly M
function eclPos(el, M) {
  M = ((M % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
  return eclPosE(el, solveKepler(M, el.e));
}
// same, but from eccentric anomaly (uniform-E sampling keeps ellipses smooth)
function eclPosE(el, E) {
  const xp = el.a * (Math.cos(E) - el.e);
  const yp = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
  const cw = Math.cos(el.w),  sw = Math.sin(el.w);
  const cn = Math.cos(el.ln), sn = Math.sin(el.ln);
  const ci = Math.cos(el.I),  si = Math.sin(el.I);
  return [
    (cw * cn - sw * sn * ci) * xp + (-sw * cn - cw * sn * ci) * yp,
    (cw * sn + sw * cn * ci) * xp + (-sw * sn + cw * cn * ci) * yp,
    (sw * si) * xp + (cw * si) * yp,
  ];
}
// ecliptic [x,y,z] (AU) -> three.js Vector3 in world units (y = ecliptic north)
function eclToScene(v, out = new THREE.Vector3()) {
  return out.set(v[0] * AU_U, v[2] * AU_U, -v[1] * AU_U);
}
function eclDirToScene(v, out = new THREE.Vector3()) {
  return out.set(v[0], v[2], -v[1]).normalize();
}
function poleVector(pole) {
  if (!pole) return [0, 0, 1];
  const lon = pole.lon * DEG, lat = pole.lat * DEG;
  return [Math.cos(lat) * Math.cos(lon), Math.cos(lat) * Math.sin(lon), Math.sin(lat)];
}

/* --- renderer / scene / camera --- */
const container = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1e-6, 6e7);
camera.position.set(0, 1500, 2900);
camera.layers.enable(1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.zoomToCursor = true;
controls.maxDistance = 7e6;   // far enough to take in the Oort cloud

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* --- lights --- */
const sunLight = new THREE.PointLight(0xfff2e0, 3, 0, 0);
scene.add(sunLight);                       // layer 0: everything not in focus
const ambient = new THREE.AmbientLight(0x44506e, 0.12);
ambient.layers.enableAll();
scene.add(ambient);
// shadow-casting light for the focused planet system (layer 1)

sysLight.layers.set(1);
sysLight.castShadow = true;
sysLight.shadow.mapSize.set(2048, 2048);
sysLight.visible = false;
scene.add(sysLight);
scene.add(sysLight.target);

/* --- starfield --- */

/* --- small-body populations: asteroid belt, Kuiper belt, Oort cloud --- */
// heliocentric particle fields; rebased with the floating origin each frame
const helioStatics = [];
function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
function makeDiskBelt(n, rInAU, rOutAU, rel) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = (rInAU + Math.random() * (rOutAU - rInAU)) * AU_U;
    const th = Math.random() * 2 * Math.PI;
    pos[i * 3] = a * Math.cos(th);
    pos[i * 3 + 1] = a * rel * gauss();     // vertical scatter ~ inclination spread
    pos[i * 3 + 2] = a * Math.sin(th);
  }
  return pos;
}
function makeShell(n, rInAU, rOutAU) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = Math.random() * 2 - 1, t = Math.random() * 2 * Math.PI;
    const s = Math.sqrt(1 - u * u);
    const r = (rInAU + (rOutAU - rInAU) * Math.pow(Math.random(), 2)) * AU_U;
    pos[i * 3] = r * s * Math.cos(t); pos[i * 3 + 1] = r * u; pos[i * 3 + 2] = r * s * Math.sin(t);
  }
  return pos;
}
function addParticles(positions, opacity, size = 1.4, color = 0x8890a8) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({
    color, size, sizeAttenuation: false, transparent: true, opacity }));
  scene.add(pts);
  helioStatics.push(pts);
  return pts;
}
addParticles(makeDiskBelt(3500, 2.1, 3.35, 0.07), 0.35);              // asteroid belt
addParticles(makeDiskBelt(3000, 30, 50, 0.06), 0.3);                  // Kuiper belt
addParticles(makeShell(9000, 2000, 20000), 0.4, 1.6, 0xa9c8e8);       // Oort cloud (inner part)

/* --- procedural Earth: continents, ice caps, cloud layer --- */
function hash3(x, y, z) {
  let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1440662683)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967295;
}
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf), sz = zf * zf * (3 - 2 * zf);
  const c = (dx, dy, dz) => hash3(xi + dx, yi + dy, zi + dz);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(c(0,0,0), c(1,0,0), sx), l(c(0,1,0), c(1,1,0), sx), sy),
    l(l(c(0,0,1), c(1,0,1), sx), l(c(0,1,1), c(1,1,1), sx), sy), sz);
}
function fbm(x, y, z, oct) {
  let v = 0, amp = 0.5, f = 1, tot = 0;
  for (let i = 0; i < oct; i++) {
    v += amp * noise3(x * f, y * f, z * f);
    tot += amp; amp *= 0.5; f *= 2.03;
  }
  return v / tot;
}
function makeEarthTextures() {
  const W = 512, H = 256;
  const surf = document.createElement("canvas"), clouds = document.createElement("canvas");
  surf.width = clouds.width = W; surf.height = clouds.height = H;
  const sctx = surf.getContext("2d"), cctx = clouds.getContext("2d");
  const sd = sctx.createImageData(W, H), cd = cctx.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    const lat = (0.5 - y / H) * Math.PI;
    for (let x = 0; x < W; x++) {
      const lon = (x / W) * 2 * Math.PI;
      // sample noise on the sphere itself so the texture wraps seamlessly
      const dx = Math.cos(lat) * Math.cos(lon), dy = Math.sin(lat), dz = Math.cos(lat) * Math.sin(lon);
      const i = (y * W + x) * 4;
      const n = fbm(dx * 2.3 + 5, dy * 2.3 + 5, dz * 2.3 + 5, 4);
      // blend land/ocean across the shoreline to avoid blocky coastlines
      const m = fbm(dx * 6 + 9, dy * 6 + 9, dz * 6 + 9, 3);
      const lr = 55 + m * 95, lg = 105 + m * 65, lb = 45 + m * 35;
      const t = Math.min(n / 0.53, 1);
      const or_ = 18 + t * 18, og = 50 + t * 35, ob = 100 + t * 50;
      const k = Math.min(Math.max((n - 0.525) / 0.012, 0), 1);
      let r = or_ + (lr - or_) * k, g = og + (lg - og) * k, b = ob + (lb - ob) * k;
      if (Math.abs(dy) + fbm(dx * 4 + 20, dy * 4 + 20, dz * 4 + 20, 2) * 0.1 > 0.97) {
        r = 235; g = 240; b = 246;                        // polar ice
      }
      sd.data[i] = r; sd.data[i + 1] = g; sd.data[i + 2] = b; sd.data[i + 3] = 255;
      const c = fbm(dx * 3.1 + 31, dy * 3.6 + 31, dz * 3.1 + 31, 4);
      const ca = Math.min(Math.max((c - 0.52) * 4, 0), 1);
      cd.data[i] = 255; cd.data[i + 1] = 255; cd.data[i + 2] = 255; cd.data[i + 3] = ca * 235;
    }
  }
  sctx.putImageData(sd, 0, 0); cctx.putImageData(cd, 0, 0);
  const st = new THREE.CanvasTexture(surf); st.colorSpace = THREE.SRGBColorSpace;
  const ct = new THREE.CanvasTexture(clouds); ct.colorSpace = THREE.SRGBColorSpace;
  return { surface: st, clouds: ct };
}
let earthClouds = null;

/* --- bodies --- */
const sphereGeo = new THREE.SphereGeometry(1, 64, 32);
const bodies = [];   // { name, kind, planet?, moon?, mesh, abs:Vector3, label, radiusU, ... }

function makeLabel(text, cls, onClick) {
  const el = document.createElement("div");
  el.className = "label " + cls;
  el.textContent = text;
  el.addEventListener("click", onClick);
  document.body.appendChild(el);
  return el;
}

// Sun
const sunBody = {
  name: "Sun", kind: "sun", abs: new THREE.Vector3(0, 0, 0), radiusU: kmU(696000),
  mesh: new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color: 0xffe9b0 })),
};
sunBody.mesh.scale.setScalar(sunBody.radiusU);
scene.add(sunBody.mesh);
{ // glow sprite
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, "rgba(255,230,160,1)");
  grad.addColorStop(0.3, "rgba(255,190,90,0.35)");
  grad.addColorStop(1, "rgba(255,190,90,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending,
    depthWrite: false, transparent: true,
  }));
  sp.scale.setScalar(sunBody.radiusU * 14);
  sunBody.glow = sp;
  scene.add(sp);
}
sunBody.label = makeLabel("Sun", "", () => focusOn(sunBody));
bodies.push(sunBody);

for (const p of PLANETS) {
  p.radiusU = kmU(p.radiusKm);
  let mat;
  if (p.name === "Earth") {
    const tex = makeEarthTextures();
    mat = new THREE.MeshStandardMaterial({ map: tex.surface, roughness: 0.9, metalness: 0 });
    earthClouds = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({
      map: tex.clouds, transparent: true, depthWrite: false, roughness: 1, metalness: 0 }));
    earthClouds.scale.setScalar(1.015);
  } else {
    mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.95, metalness: 0 });
  }
  const mesh = new THREE.Mesh(sphereGeo, mat);
  mesh.castShadow = mesh.receiveShadow = true;
  if (earthClouds && p.name === "Earth") mesh.add(earthClouds);
  scene.add(mesh);

  if (p.ring) {
    const rg = new THREE.RingGeometry(p.ring.inner, p.ring.outer, 128);
    const rm = new THREE.MeshStandardMaterial({ color: 0xd8c8a0, roughness: 1, metalness: 0,
      side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
    const ring = new THREE.Mesh(rg, rm);
    ring.castShadow = ring.receiveShadow = true;
    ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1),
                                       eclDirToScene(poleVector(p.pole)));
    mesh.add(ring);   // inherits planet position & scale
  }

  const body = { name: p.name, kind: "planet", planet: p, mesh,
                 abs: new THREE.Vector3(), radiusU: p.radiusU,
                 label: makeLabel(p.name, "", () => focusOn(body)) };
  p.body = body;
  bodies.push(body);

  // moon system basis vectors (planet's equatorial plane where given)
  const pole = poleVector(p.pole);
  let u = [pole[1], -pole[0], 0];                       // ⊥ pole, in ecliptic plane
  const ul = Math.hypot(u[0], u[1], u[2]);
  u = ul < 1e-6 ? [1, 0, 0] : u.map(x => x / ul);
  const v = [ pole[1] * u[2] - pole[2] * u[1],
              pole[2] * u[0] - pole[0] * u[2],
              pole[0] * u[1] - pole[1] * u[0] ];
  p.moonU = eclDirToScene(u); p.moonV = eclDirToScene(v);

  if (p.moons) {
    p.systemRadiusU = 0;
    for (const m of p.moons) {
      m.aU = kmU(m.aKm);
      m.radiusU = kmU(m.radiusKm);
      if (m.rate === undefined) m.rate = 360 / m.period;
      if (m.phase === undefined) m.phase = (m.aKm * 7.3) % 360;
      if (m.period === undefined) m.period = 360 / m.rate;
      p.systemRadiusU = Math.max(p.systemRadiusU, m.aU);

      const mm = new THREE.Mesh(sphereGeo,
        new THREE.MeshStandardMaterial({ color: 0xaab4cc, roughness: 0.95, metalness: 0 }));
      mm.castShadow = mm.receiveShadow = true;
      scene.add(mm);

      // orbit circle in the moon-system plane
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * 2 * Math.PI;
        pts.push(new THREE.Vector3()
          .addScaledVector(p.moonU, m.aU * Math.cos(a))
          .addScaledVector(p.moonV, m.aU * Math.sin(a)));
      }
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x96a0be, transparent: true, opacity: 0.18 }));
      scene.add(line);

      const body = { name: m.name, kind: "moon", planet: p, moon: m, mesh: mm, orbitLine: line,
                     abs: new THREE.Vector3(), radiusU: m.radiusU,
                     label: makeLabel(m.name, "moon", () => focusOn(body)) };
      m.body = body;
      bodies.push(body);
    }
  } else {
    p.systemRadiusU = p.radiusU * 30;
  }
}

/* --- planet orbit lines (sampled ellipses, refreshed weekly) --- */
const orbitLines = PLANETS.map(p => {
  const line = new THREE.Line(
    new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color: 0x96a0be, transparent: true,
                                  opacity: p.dwarf ? 0.14 : 0.3 }));
  scene.add(line);
  return line;
});
let orbitsT = null;
function refreshOrbits(T) {
  if (orbitsT !== null && Math.abs(T - orbitsT) < 7 / 36525) return;
  orbitsT = T;
  PLANETS.forEach((p, i) => {
    const el = elementsAt(p, T);
    const pts = [];
    for (let j = 0; j <= 256; j++) {
      pts.push(eclToScene(eclPosE(el, (j / 256) * 2 * Math.PI)));
    }
    orbitLines[i].geometry.setFromPoints(pts);
  });
}

/* --- size exaggeration (default: real) --- */
let sizeMult = 1;
function effRadius(b) {
  if (b.kind === "sun")  return Math.min(b.radiusU * sizeMult, 10);
  if (b.kind === "moon") return Math.min(b.radiusU * sizeMult, b.moon.aU * 0.25);
  const cap = b.planet.moons ? b.planet.moons[0].aU * 0.4 : Infinity;
  return Math.min(b.radiusU * sizeMult, cap);
}
function applySizes() {
  for (const b of bodies) {
    b.effR = effRadius(b);
    b.mesh.scale.setScalar(b.effR);
  }
  sunBody.glow.scale.setScalar(sunBody.effR * 14);
  controls.minDistance = (focus.effR || focus.radiusU) * 2.5;
}
document.querySelectorAll("#size-group .btn").forEach(b => {
  b.addEventListener("click", () => {
    sizeMult = Number(b.dataset.mult);
    document.querySelectorAll("#size-group .btn").forEach(x => x.classList.toggle("active", x === b));
    applySizes();
  });
});

/* --- focus / camera --- */
let focus = sunBody;
const focusCenter = new THREE.Vector3();

function focusOn(b, keepDistance = false) {
  const prev = focus;
  focus = b;
  // keep camera direction, jump to a sensible viewing distance
  if (!keepDistance) {
    let dist;
    if (b.kind === "sun") dist = 2600;
    else if (b.kind === "moon") dist = b.effR * 12;
    else dist = b.planet.moons ? b.planet.systemRadiusU * 2.6 : b.effR * 18;
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(dir.multiplyScalar(dist));
  } else {
    camera.position.sub(b.abs).add(prev.abs);
  }
  controls.target.set(0, 0, 0);
  controls.minDistance = b.effR * 2.5;
  applyLayers();
  infoIsCustom = false;
  showInfo(b);
  setSidebarActive(b.name);
}

function applyLayers() {
  const sysPlanet = focus.kind === "sun" ? null : focus.planet;
  for (const b of bodies) {
    if (b.kind === "sun") continue;
    const inSys = sysPlanet && b.planet === sysPlanet;
    b.mesh.traverse(o => o.layers.set(inSys ? 1 : 0));
  }
  sysLight.visible = !!sysPlanet;
}

/* --- info panel --- */
let infoIsCustom = false;   // region (belt/cloud) text — don't auto-refresh over it
const infoEl = document.getElementById("info");
document.getElementById("info-close").addEventListener("click", () => {
  infoEl.style.display = "none";
});
function fmt(n, digits = 3) {
  return n.toLocaleString(undefined, { maximumFractionDigits: digits });
}
function showInfo(b) {
  document.getElementById("info-name").textContent = b.name;
  const stats = document.getElementById("info-stats");
  const blurb = document.getElementById("info-blurb");
  if (b.kind === "sun") {
    blurb.textContent = "Our star. 99.86% of the solar system's mass.";
    stats.innerHTML = "<dt>Radius</dt><dd>696,000 km</dd>";
  } else if (b.kind === "moon") {
    blurb.textContent = `Moon of ${b.planet.name}.`;
    stats.innerHTML =
      `<dt>Orbit radius</dt><dd>${fmt(b.moon.aKm, 0)} km</dd>` +
      `<dt>Orbital period</dt><dd>${fmt(Math.abs(b.moon.period), 2)} days${b.moon.period < 0 ? " (retrograde)" : ""}</dd>` +
      `<dt>Radius</dt><dd>${fmt(b.moon.radiusKm, 0)} km</dd>`;
  } else {
    blurb.textContent = b.planet.blurb || "";
    stats.innerHTML =
      `<dt>Distance from Sun</dt><dd>${fmt(b.sunDistAU || 0)} AU</dd>` +
      `<dt>Radius</dt><dd>${fmt(b.planet.radiusKm, 0)} km</dd>` +
      `<dt>Moons shown</dt><dd>${b.planet.moons ? b.planet.moons.length : 0}</dd>`;
  }
  infoEl.style.display = "block";
}

/* --- sidebar: quick navigation --- */
const REGIONS = [
  { name: "Asteroid Belt", dist: 1100, color: "#8890a8", span: "2.1 – 3.3 AU",
    blurb: "Millions of rocky bodies between Mars and Jupiter — leftovers that never formed a planet." },
  { name: "Kuiper Belt", dist: 16000, color: "#8890a8", span: "30 – 50 AU",
    blurb: "A disk of icy bodies beyond Neptune. Pluto is its most famous resident." },
  { name: "Oort Cloud", dist: 5.2e6, color: "#8890a8", span: "≈2,000 – 100,000 AU",
    blurb: "A vast spherical halo of icy bodies, the source of long-period comets. Only its inner part is shown — it reaches halfway to the next star." },
];
function viewRegion(r) {
  focusOn(sunBody);
  camera.position.setLength(r.dist);
  document.getElementById("info-name").textContent = r.name;
  document.getElementById("info-blurb").textContent = r.blurb;
  document.getElementById("info-stats").innerHTML = `<dt>Extent</dt><dd>${r.span}</dd>`;
  infoEl.style.display = "block";
  infoIsCustom = true;
  setSidebarActive(r.name);
}
const sidebarEl = document.getElementById("sidebar");
function navBtn(name, color, onClick) {
  const b = document.createElement("button");
  b.className = "nav";
  b.dataset.name = name;
  b.innerHTML = `<span class="dot" style="background:${color}"></span>${name}`;
  b.addEventListener("click", onClick);
  sidebarEl.appendChild(b);
}
function navDivider() { sidebarEl.appendChild(document.createElement("hr")); }
function setSidebarActive(name) {
  sidebarEl.querySelectorAll(".nav").forEach(b =>
    b.classList.toggle("active", b.dataset.name === name));
}
{
  const css = c => "#" + c.toString(16).padStart(6, "0");
  navBtn("Sun", "#ffe9b0", () => focusOn(sunBody));
  for (const n of ["Mercury", "Venus", "Earth", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"]) {
    const b = bodies.find(x => x.name === n);
    navBtn(n, css(b.planet.color), () => focusOn(b));
  }
  navDivider();
  for (const n of ["Ceres", "Pluto", "Eris", "Halley"]) {
    const b = bodies.find(x => x.name === n);
    navBtn(n, css(b.planet.color), () => focusOn(b));
  }
  navDivider();
  for (const r of REGIONS) navBtn(r.name, r.color, () => viewRegion(r));
}

/* --- picking on the canvas (screen-space nearest body) --- */
let downPos = null;
renderer.domElement.addEventListener("pointerdown", e => { downPos = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
  downPos = null;
  if (moved > 5) return;
  let best = null, bestD = 26;
  for (const b of bodies) {
    if (b.screen && b.screen.visible) {
      const d = Math.hypot(b.screen.x - e.clientX, b.screen.y - e.clientY) - b.screen.r;
      if (d < bestD) { bestD = d; best = b; }
    }
  }
  if (best) focusOn(best);
  else infoEl.style.display = "none";
});

/* --- simulation time + HUD --- */
let simTime = Date.now();
let speed = 1;
let lastFrame = performance.now();
const clockText = document.getElementById("clock-text");
const clockEl = document.getElementById("clock");
document.querySelectorAll("#speed-group .btn").forEach(b => {
  b.addEventListener("click", () => {
    speed = Number(b.dataset.speed);
    document.querySelectorAll("#speed-group .btn").forEach(x => x.classList.toggle("active", x === b));
    clockEl.classList.toggle("warped", speed !== 1);
  });
});
document.getElementById("btn-now").addEventListener("click", () => { simTime = Date.now(); });

const roFocus = document.getElementById("readout-focus");
const roDist = document.getElementById("readout-dist");

/* --- main loop --- */
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
let infoTick = 0;

function updatePositions(T, d) {
  for (const p of PLANETS) {
    const el = elementsAt(p, T);
    const xyz = eclPos(el, el.M);
    p.body.sunDistAU = Math.hypot(xyz[0], xyz[1], xyz[2]);
    eclToScene(xyz, p.body.abs);
    if (p.moons) {
      for (const m of p.moons) {
        const ang = (m.phase + m.rate * d) * DEG;
        m.body.abs.copy(p.body.abs)
          .addScaledVector(p.moonU, m.aU * Math.cos(ang))
          .addScaledVector(p.moonV, m.aU * Math.sin(ang));
      }
    }
  }
}

function updateLabels() {
  const w = window.innerWidth, h = window.innerHeight;
  // zoomed out past ~650 AU the planet labels all collapse onto the Sun — hide them
  const farOut = camera.position.distanceTo(controls.target) > 1e5;
  for (const b of bodies) {
    tmp.copy(b.abs).sub(focusCenter).sub(controls.target);
    const dist = tmp.length();
    tmp.copy(b.abs).sub(focusCenter).project(camera);
    const onScreen = tmp.z < 1 && tmp.x > -1.05 && tmp.x < 1.05 && tmp.y > -1.05 && tmp.y < 1.05;
    const x = (tmp.x + 1) / 2 * w, y = (1 - tmp.y) / 2 * h;
    // apparent pixel radius for picking
    const camDist = tmp2.copy(b.abs).sub(focusCenter).sub(camera.position).length();
    const pxR = (b.effR / camDist) * (h / 2) / Math.tan(camera.fov * DEG / 2);
    b.screen = { x, y, r: pxR, visible: onScreen };

    let show = onScreen && !(farOut && b.kind !== "sun");
    if (show && b.kind === "moon") {
      const ps = b.planet.body.screen;
      show = ps && Math.hypot(ps.x - x, ps.y - y) > 22 || focus === b;
    }
    b.label.style.display = show ? "block" : "none";
    if (show) b.label.style.transform = `translate(${x + 8}px, ${y - 7}px)`;
  }
}

function updateSysLight() {
  if (!sysLight.visible) return;
  const p = focus.planet;
  // light direction: from the Sun toward the focused planet
  const dir = tmp.copy(p.body.abs).normalize();
  const sysR = p.systemRadiusU * 1.1;
  const D = Math.max(sysR * 5, p.radiusU * 20);
  const focusScene = tmp2.copy(focus.abs).sub(focusCenter);
  sysLight.position.copy(focusScene).addScaledVector(dir, -D);
  sysLight.target.position.copy(focusScene);
  // adaptive shadow frustum: tighter when zoomed in -> crisper eclipse shadows
  const camDist = camera.position.distanceTo(controls.target);
  const planetSpan = focus.kind === "moon"
    ? focus.abs.distanceTo(p.body.abs) + p.body.effR * 1.2 : 0;
  const half = Math.min(Math.max(camDist * 1.5, focus.effR * 4, planetSpan), sysR * 1.6);
  const sc = sysLight.shadow.camera;
  sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half;
  sc.near = Math.max(D - sysR * 2, 0.001); sc.far = D + sysR * 2;
  sc.updateProjectionMatrix();
  sysLight.shadow.normalBias = Math.max(focus.effR, p.body.effR) * 0.02;
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(now - lastFrame, 100);
  lastFrame = now;
  simTime += dt * speed;

  const T = julianCenturies(simTime);
  const d = daysSinceJ2000(simTime);
  refreshOrbits(T);
  updatePositions(T, d);

  focusCenter.copy(focus.abs);

  // place everything relative to the focus (floating origin: keeps precision)
  for (const b of bodies) {
    b.mesh.position.copy(b.abs).sub(focusCenter);
    if (b.orbitLine) b.orbitLine.position.copy(b.planet.body.abs).sub(focusCenter);
  }
  sunBody.glow.position.copy(sunBody.mesh.position);
  sunLight.position.copy(sunBody.mesh.position);
  // keep the Sun visibly bright from any distance
  const sunCamDist = sunBody.mesh.position.distanceTo(camera.position);
  sunBody.glow.scale.setScalar(Math.max(sunBody.effR * 14, sunCamDist * 0.045));
  for (const line of orbitLines) line.position.copy(focusCenter).negate();
  for (const pts of helioStatics) pts.position.copy(focusCenter).negate();

  if (earthClouds) earthClouds.rotation.y += dt * 2e-6;
  updateSysLight();
  controls.update();
  updateLabels();

  // keep the info panel's live values (e.g. distance from Sun) fresh
  if (infoEl.style.display === "block" && !infoIsCustom && ++infoTick % 30 === 0) showInfo(focus);

  // HUD
  const dte = new Date(simTime);
  clockText.textContent = dte.toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  const camDist = camera.position.distanceTo(controls.target);
  const au = camDist / AU_U;
  roFocus.textContent = "viewing " + focus.name;
  roDist.textContent = au >= 0.02
    ? `${fmt(au, 2)} AU away`
    : `${fmt(camDist * UNIT_KM, 0)} km away`;

  renderer.render(scene, camera);
}

applySizes();
applyLayers();
refreshOrbits(julianCenturies(simTime));
requestAnimationFrame(frame);

// debugging hooks
window.SG = { bodies, PLANETS, focusOn, camera, controls,
  get focus() { return focus; },
  set simTime(v) { simTime = v; }, get simTime() { return simTime; },
  setSpeed(v) { speed = v; } };
</script>
</body>
</html>
